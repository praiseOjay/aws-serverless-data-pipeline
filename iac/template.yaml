AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Serverless Data Engineering Pipeline (Step Functions State Machine -> S3 Parquet -> DynamoDB -> API Gateway)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:
  # 1. S3 Storage Buckets
  RawS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aws-data-pipeline-raw-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled

  ProcessedS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aws-data-pipeline-processed-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled

  # 2. DynamoDB Table for Fast Key-Value API Lookups
  WeatherDynamoDBTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "weather-analytics-${Environment}"
      PrimaryKey:
        Name: id
        Type: String

  # 3. Pipeline Step Lambdas
  IngesterLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "data-pipeline-ingester-${Environment}"
      CodeUri: ../src/
      Handler: ingester.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          RAW_S3_BUCKET: !Ref RawS3Bucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref RawS3Bucket

  ValidatorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "data-pipeline-validator-${Environment}"
      CodeUri: ../src/
      Handler: validator_lambda.lambda_handler
      Runtime: python3.11
      Timeout: 30

  TransformerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "data-pipeline-transformer-${Environment}"
      CodeUri: ../src/
      Handler: transformer.lambda_handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          PROCESSED_S3_BUCKET: !Ref ProcessedS3Bucket
          DYNAMODB_TABLE: !Ref WeatherDynamoDBTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawS3Bucket
        - S3CrudPolicy:
            BucketName: !Ref ProcessedS3Bucket
        - DynamoDBCrudPolicy:
            TableName: !Ref WeatherDynamoDBTable

  # 4. API Gateway Handler Lambda
  ApiHandlerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "data-pipeline-api-${Environment}"
      CodeUri: ../src/
      Handler: api_handler.lambda_handler
      Runtime: python3.11
      Timeout: 15
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref WeatherDynamoDBTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeatherDynamoDBTable
      Events:
        GetLatest:
          Type: Api
          Properties:
            Path: /api/weather/latest
            Method: GET
        GetHistory:
          Type: Api
          Properties:
            Path: /api/weather/history
            Method: GET

  # 5. AWS Step Functions State Machine Orchestrator
  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "weather-data-pipeline-${Environment}"
      DefinitionUri: state_machine.asl.json
      DefinitionSubstitutions:
        IngesterArn: !GetAtt IngesterLambda.Arn
        ValidatorArn: !GetAtt ValidatorLambda.Arn
        TransformerArn: !GetAtt TransformerLambda.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IngesterLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidatorLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref TransformerLambda
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

  # 6. Glue Data Catalog Database
  GlueWeatherDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "weather_analytics_db_${Environment}"
        Description: "Catalog database for processed weather parquet dataset"

  # 7. Amazon Athena Workgroup
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "WeatherAnalyticsWorkgroup-${Environment}"
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${ProcessedS3Bucket}/athena-query-results/"

Outputs:
  RawS3BucketName:
    Value: !Ref RawS3Bucket
  ProcessedS3BucketName:
    Value: !Ref ProcessedS3Bucket
  DynamoDBTableName:
    Value: !Ref WeatherDynamoDBTable
  StateMachineArn:
    Value: !Ref PipelineStateMachine
